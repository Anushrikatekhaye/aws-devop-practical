<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <rect width="900" height="600" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="18" font-weight="bold">AWS Architecture — ALB (HTTPS) → Auto Scaling EC2 → RDS MySQL</text>

  <!-- Internet -->
  <rect x="380" y="42" width="140" height="34" rx="6" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="450" y="64" text-anchor="middle">Internet / Users</text>
  <line x1="450" y1="76" x2="450" y2="108" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="458" y="98" font-size="11">HTTPS 443</text>

  <!-- VPC -->
  <rect x="30" y="108" width="840" height="470" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="42" y="128" font-weight="bold">VPC 10.0.0.0/16 (2 Availability Zones)</text>
  <rect x="385" y="112" width="130" height="22" rx="4" fill="#fde68a" stroke="#b45309"/>
  <text x="450" y="128" text-anchor="middle" font-size="12">Internet Gateway</text>

  <!-- Public tier -->
  <rect x="50" y="145" width="800" height="120" rx="8" fill="#ecfdf5" stroke="#059669"/>
  <text x="62" y="163" font-weight="bold" fill="#065f46">Public subnets (AZ-a, AZ-b)</text>
  <rect x="330" y="172" width="240" height="46" rx="6" fill="#fff" stroke="#059669" stroke-width="2"/>
  <text x="450" y="192" text-anchor="middle" font-weight="bold">Application Load Balancer</text>
  <text x="450" y="209" text-anchor="middle" font-size="11">443 (ACM cert) · 80 → 443 redirect</text>
  <rect x="80" y="180" width="130" height="40" rx="6" fill="#fff" stroke="#059669"/>
  <text x="145" y="205" text-anchor="middle">NAT Gateway</text>

  <!-- App tier -->
  <rect x="50" y="285" width="800" height="130" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="62" y="303" font-weight="bold" fill="#1e40af">Private app subnets — Auto Scaling Group (Launch Template, AL2023, IMDSv2)</text>
  <rect x="200" y="318" width="200" height="82" rx="6" fill="#fff" stroke="#2563eb"/>
  <text x="300" y="342" text-anchor="middle" font-weight="bold">EC2 (AZ-a)</text>
  <text x="300" y="360" text-anchor="middle" font-size="11">Flask + gunicorn :8080</text>
  <text x="300" y="376" text-anchor="middle" font-size="11">IAM role · SSM access</text>
  <rect x="500" y="318" width="200" height="82" rx="6" fill="#fff" stroke="#2563eb"/>
  <text x="600" y="342" text-anchor="middle" font-weight="bold">EC2 (AZ-b)</text>
  <text x="600" y="360" text-anchor="middle" font-size="11">Flask + gunicorn :8080</text>
  <text x="600" y="376" text-anchor="middle" font-size="11">IAM role · SSM access</text>

  <!-- DB tier -->
  <rect x="50" y="435" width="500" height="125" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="62" y="453" font-weight="bold" fill="#991b1b">Private DB subnets (no internet route)</text>
  <rect x="80" y="468" width="190" height="72" rx="6" fill="#fff" stroke="#dc2626"/>
  <text x="175" y="492" text-anchor="middle" font-weight="bold">RDS MySQL primary</text>
  <text x="175" y="510" text-anchor="middle" font-size="11">Encrypted · SG: 3306 from app</text>
  <rect x="320" y="468" width="200" height="72" rx="6" fill="#fff" stroke="#dc2626" stroke-dasharray="5 3"/>
  <text x="420" y="492" text-anchor="middle" font-weight="bold">RDS standby (Multi-AZ)</text>
  <text x="420" y="510" text-anchor="middle" font-size="11">Synchronous replication</text>
  <line x1="270" y1="504" x2="320" y2="504" stroke="#dc2626" stroke-width="2"/>

  <!-- Regional services -->
  <rect x="590" y="435" width="260" height="125" rx="8" fill="#faf5ff" stroke="#7c3aed"/>
  <text x="602" y="453" font-weight="bold" fill="#5b21b6">Regional AWS services</text>
  <text x="602" y="475">• Secrets Manager (DB credentials)</text>
  <text x="602" y="495">• S3 app bucket (release + uploads)</text>
  <text x="602" y="515">• S3 ALB access-log bucket</text>
  <text x="602" y="535">• ACM certificate · IAM · SSM</text>

  <!-- arrows -->
  <line x1="450" y1="218" x2="320" y2="318" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <line x1="450" y1="218" x2="580" y2="318" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <line x1="300" y1="400" x2="200" y2="468" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <line x1="600" y1="400" x2="250" y2="480" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <line x1="700" y1="360" x2="760" y2="435" stroke="#7c3aed" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#b)"/>
  <line x1="570" y1="195" x2="760" y2="435" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#b)"/>
  <text x="712" y="300" font-size="11" fill="#5b21b6">logs → S3</text>
  <line x1="145" y1="220" x2="250" y2="318" stroke="#666" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#a)"/>
  <text x="95" y="250" font-size="11" fill="#444">outbound via NAT</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker>
    <marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7c3aed"/></marker>
  </defs>
</svg>
